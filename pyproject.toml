[project]
name = "nse-relative-strength"
version = "1.0.0"
description = "NSE Relative-Strength dashboard: equal-weight RS rankings, market breadth, rotation view"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "playwright", "httpx"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# test files organise imports in sections around fixtures — intentional
"tests/*" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "smoke: frontend smoke tests (boot a server + headless browser)",
]
