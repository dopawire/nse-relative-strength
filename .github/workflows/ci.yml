name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests fastapi "uvicorn[standard]" pytest ruff httpx

      - name: Lint
        run: ruff check .

      - name: Unit + integration tests
        # NO_BROWSER=1: skip the Playwright smoke tests (no display/caches in CI)
        run: NO_BROWSER=1 python -m pytest tests/ -q

      - name: Audit tool self-check
        run: python -c "import audit_data"   # import/syntax sanity (no caches in CI)
